<style>

/* ── LEFT PANEL ──────────────────────────────────────────── */
.left-panel {
  position: fixed;
  left: 0; bottom: 0; top: 0;
  width: clamp(80px, 10vw, 120px);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 0 0 clamp(20px, 3vh, 40px) clamp(20px, 2.5vw, 36px);
  z-index: 20;
  pointer-events: none;
}
.left-nav {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: clamp(6px, 1vh, 12px);
  margin-bottom: clamp(16px, 2.5vh, 28px);
  pointer-events: all;
}
.nav-pill {
  border: none !important;
  background: none !important;
  border-radius: 0 !important;
  color: rgba(240, 238, 232, 0.32) !important;
  padding: 2px 0;
  font-family: 'Cinzel', serif;
  font-size: clamp(0.58rem, 0.85vw, 0.72rem);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-decoration: none;
  transition: color 0.25s ease, text-shadow 0.25s ease !important;
  pointer-events: all;
  white-space: nowrap;
}
.nav-pill:hover {
  color: rgba(220, 235, 255, 0.95) !important;
  background: none !important;
  text-shadow:
    0 0 14px rgba(180, 210, 255, 0.85),
    0 0 36px rgba(160, 190, 255, 0.45) !important;
}
.bottom-logo {
  pointer-events: all;
  opacity: 0.7;
  transition: opacity 0.3s ease;
  cursor: default;
  display: flex;
  align-items: center;
}
.bottom-logo:hover { opacity: 1; }
.bottom-logo svg {
  height: clamp(30px, 4vh, 42px);
  width: auto;
  filter: drop-shadow(0 1px 12px rgba(180,210,255,0.35));
}

/* ── INFO STAR (top-right) ───────────────────────────────── */
.info-star-wrap {
  position: fixed;
  top: clamp(18px, 3vh, 32px);
  right: clamp(20px, 2.5vw, 36px);
  z-index: 30;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.info-star-svg {
  width: clamp(18px, 2vw, 26px);
  height: clamp(18px, 2vw, 26px);
  opacity: 0.45;
  transition: opacity 0.3s ease, filter 0.3s ease;
  filter: drop-shadow(0 0 0px rgba(180,210,255,0));
}
.info-star-wrap:hover .info-star-svg,
.info-star-wrap.active .info-star-svg {
  opacity: 1;
  filter:
    drop-shadow(0 0 8px rgba(180,210,255,0.9))
    drop-shadow(0 0 20px rgba(160,190,255,0.5));
}
.info-star-tooltip {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  width: clamp(200px, 22vw, 320px);
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(0.72rem, 0.95vw, 0.85rem);
  font-weight: 300;
  line-height: 1.75;
  color: rgba(200, 220, 255, 0.58);
  text-align: right;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.info-star-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ── CONTACT LAYOUT ──────────────────────────────────────── */
.contact-stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(24px, 4vh, 56px) clamp(80px, 12vw, 160px);
  z-index: 10;
  pointer-events: none;
}

.contact-panel {
  pointer-events: all;
  width: 100%;
  max-width: 860px;
  display: flex;
  flex-direction: column;
  gap: clamp(24px, 3.5vh, 40px);
}

.contact-heading {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.1rem, 2vw, 1.6rem);
  font-weight: 600;
  letter-spacing: 0.1em;
  color: rgba(255, 255, 255, 0.92);
  text-shadow:
    0 0 24px rgba(200, 225, 255, 0.3),
    0 0 60px rgba(180, 210, 255, 0.12);
}

.contact-divider {
  width: 40px;
  height: 1px;
  background: rgba(180, 210, 255, 0.18);
  margin-top: -10px;
}

/* two-column form grid */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(16px, 2.5vh, 28px) clamp(24px, 4vw, 48px);
}

/* message field spans full width */
.form-group.full { grid-column: 1 / -1; }

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(180, 210, 255, 0.45);
}

.form-group input,
.form-group textarea {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(0.95rem, 1.1vw, 1.05rem);
  font-weight: 300;
  color: rgba(240, 238, 232, 0.9);
  background: radial-gradient(ellipse at center,
    rgba(13, 21, 53, 0.72) 0%,
    rgba(8, 12, 32, 0.55) 100%
  );
  border: none;
  border-bottom: 1px solid rgba(180, 210, 255, 0.2);
  border-radius: 0;
  padding: 10px 4px;
  outline: none;
  width: 100%;
  transition: border-color 0.25s ease, background 0.25s ease;
  resize: none;
}
.form-group input::placeholder,
.form-group textarea::placeholder {
  color: rgba(180, 210, 255, 0.22);
  font-style: italic;
}
.form-group input:focus,
.form-group textarea:focus {
  border-color: rgba(180, 210, 255, 0.55);
  background: radial-gradient(ellipse at center,
    rgba(13, 21, 53, 0.88) 0%,
    rgba(8, 12, 32, 0.72) 100%
  );
}
.form-group textarea {
  min-height: clamp(80px, 12vh, 120px);
  line-height: 1.75;
}

.form-footer {
  display: flex;
  justify-content: flex-end;
}

.submit-btn {
  font-family: 'Cinzel', serif;
  font-size: clamp(0.55rem, 0.75vw, 0.65rem);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(180, 210, 255, 0.55);
  background: transparent;
  border: none;
  padding: 4px 0;
  cursor: pointer;
  transition: color 0.25s ease, text-shadow 0.25s ease;
}
.submit-btn:hover {
  color: rgba(220, 235, 255, 0.95);
  text-shadow:
    0 0 14px rgba(180, 210, 255, 0.85),
    0 0 36px rgba(160, 190, 255, 0.45);
}

@media (max-width: 700px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: 1; }
  .contact-stage { padding: 80px 24px 40px; }
}
</style>

<script>
// ── STAR BACKGROUND ──────────────────────────────────────
const stage = document.getElementById('stage');
const cv    = document.getElementById('cv');
const bg    = document.getElementById('bg');

function resizeCv() {
  cv.width  = stage.offsetWidth;
  cv.height = stage.offsetHeight;
}
window.addEventListener('resize', resizeCv);
resizeCv();

for (let i = 0; i < 120; i++) {
  const d = document.createElement('div');
  d.className = 'dot';
  const s = Math.random() * 2 + 0.5;
  d.style.cssText = `width:${s}px;height:${s}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+1.5).toFixed(2)}s;--delay:-${(Math.random()*5).toFixed(2)}s`;
  bg.appendChild(d);
}

// ── INFO STAR ────────────────────────────────────────────
const dracoTexts = [
  "Draco is a large, circumpolar constellation in the far northern sky representing a dragon, cataloged by Ptolemy in the 2nd century. Known as the \"Dragon Between the Dippers,\" it winds between Ursa Major and Ursa Minor. Its brightest star is Eltanin (Gamma Draconis), while Thuban was the North Star in ancient Egypt.",
  "The star Thuban (Alpha Draconis) is a white giant in Draco's tail, famous for being the Earth's North Star approximately 5,000 years ago (c. 2830 BC). At magnitude 3.65, it was used for navigation by ancient Egyptians, but is no longer the pole star due to Earth's axial precession.",
  "The October Draconids, also historically known as the Giacobinids, are a Northern Hemisphere meteor shower whose parent body is the periodic comet 21P/Giacobini-Zinner. They are named after the constellation Draco, whose head they seemingly radiate from.",
];
let infoState = -1;
const infoStarBtn     = document.getElementById('info-star-btn');
const infoStarTooltip = document.getElementById('info-star-tooltip');
infoStarBtn.addEventListener('click', () => {
  if (infoState === -1) {
    infoState = 0;
    infoStarTooltip.textContent = dracoTexts[0];
    infoStarTooltip.classList.add('visible');
    infoStarBtn.classList.add('active');
  } else if (infoState < dracoTexts.length - 1) {
    infoState++;
    infoStarTooltip.classList.remove('visible');
    setTimeout(() => {
      infoStarTooltip.textContent = dracoTexts[infoState];
      infoStarTooltip.classList.add('visible');
    }, 180);
  } else {
    infoStarTooltip.classList.remove('visible');
    infoStarBtn.classList.remove('active');
    infoState = -1;
  }
});

// ── MOBILE STAR BACKGROUND ───────────────────────────────
const mobileBg = document.getElementById('mobile-bg');
if (mobileBg) {
  for (let i = 0; i < 100; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const s = Math.random() * 2 + 0.4;
    d.style.cssText = `width:${s}px;height:${s}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+1.5).toFixed(2)}s;--delay:-${(Math.random()*5).toFixed(2)}s`;
    mobileBg.appendChild(d);
  }
}

</script>
